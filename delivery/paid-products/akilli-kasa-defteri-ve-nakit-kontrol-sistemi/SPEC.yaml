# =============================================================================
# SPEC.yaml — KASA-PRO · TEK GERÇEK KAYNAK
# kur/ana.py bunu okur ve .xlsx üretir.
# dogrula/denetci.py + olcek_testi.py + deger_kapilari.py bunu okur ve sınar.
# Hücre yerleşimi, formül, eşik — hepsi burada. Koda elle hücre yazmak yasaktır.
#
# v4 mandata (yeni_calisma_ilkeleri/EXCEL_URETIM_MANDATE_v4.md) gereği:
#  - tüm formül ayraçları VİRGÜL (Ç4 → D14)
#  - dizi formülü yok, SUMPRODUCT/yardımcı kolon (Ç5)
#  - yasak fonksiyonlar kullanılmaz; _xlfn. önekli güvenli set kullanılır
#  - deger: ve serbest_alternatif: BOŞ — iş kararı, sahibi doldurur (§15/6)
# =============================================================================

urun:
  kod: KASA-PRO
  ad: "Akıllı Kasa Defteri ve Nakit Kontrol Sistemi"
  surum: "2.0.0"
  fiyat_capasi_usd: 200
  hedef_kullanici: "Muhasebe sorumlusu / mali müşavir / işletme sahibi"

# --- denetçiye geçen sözleşme -------------------------------------------------
denetim:
  giris_dolgu: ["FFFFF2CC"]
  koruma_sifresi: "1234"
  asgari_kb_kurali_toplam: 40
  asgari_grafik: 8
  volatil_ust_sinir: 12
  sonda_olacak_sayfalar: ["LISTELER", "AYARLAR", "KILAVUZ"]
  asgari_tablo_kapasitesi: 1000
  karar_sayfasi: "KARAR"
  motor_sayfasi: "MOTOR"
  pano_sayfasi: "PANO"
  ayarlar_sayfasi: "AYARLAR"
  bos_dosya_beklenen_karar: "VERİ YOK"

# --- görsel sistem (stil.py tek buradan beslenir) ----------------------------
stil:
  yazitipi: "Segoe UI"
  renk:
    zemin:        "F7F9FC"
    kart:         "FFFFFF"
    koyuBaslik:   "0F2742"
    vurgu:        "B08948"
    olumlu:       "1F7A4D"
    uyari:        "B7791F"
    risk:         "B3261E"
    girisAlani:   "FFF2CC"
    kilitliCikti: "EEF2F7"
  bicim:
    para:   '₺ #.##0,00;[Red](₺ #.##0,00);"-"'
    tamsayi: '#.##0;[Red](#.##0);"-"'
    yuzde:  '%0,0;[Red](%0,0);"-"'
    tarih:  'dd.mm.yyyy'
    saat:   'hh:mm'
    kat:    '0,0"x"'

# --- sayfalar: sıra bağlayıcıdır ---------------------------------------------
sayfalar:
  - ad: KAPAK
    tur: sunum
    sekme_rengi: "0F2742"
  - ad: HIZLI_BASLANGIC
    tur: sunum
  - ad: HESAPLAR
    tur: giris
    tablo: tblHesaplar
    kapasite: 1000
  - ad: KASA_HAREKETLERI
    tur: giris
    tablo: tblHareketler
    kapasite: 5000
  - ad: ODEME_TAKVIMI
    tur: giris
    tablo: tblTakvim
    kapasite: 2000
  - ad: FIZIKI_SAYIM
    tur: giris
    tablo: tblSayim
    kapasite: 1000
  - ad: MOTOR
    tur: motor
  - ad: KONTROL
    tur: kontrol
  - ad: KARAR
    tur: karar
  - ad: PANO
    tur: pano
    baski: true
  - ad: SENARYO_DUYARLILIK
    tur: analiz
  - ad: RAPOR
    tur: rapor
    baski: true
  - ad: ORNEK_VERI
    tur: ornek
  - ad: DEGISIKLIK_KAYDI
    tur: kayit
  - ad: LISTELER
    tur: liste
  - ad: AYARLAR
    tur: ayar
  - ad: KILAVUZ
    tur: kilavuz

# --- parametreler: formüle sabit sayı gömmek yerine ad tanımı üretilir --------
# AYARLAR sayfası zorunlu kolonlar: anahtar | deger | birim | aciklama |
# kaynak | yururluk_tarihi | dogrulama_tarihi   (D10)
ayarlar:
  - anahtar: firmaUnvani
    deger: ""
    birim: "metin"
    tip: metin
    zorunlu: true
    aciklama: "Rapor başlığında görünür"
    kaynak: "Kullanıcı girişi"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: raporTarihi
    deger: "=TODAY()"
    birim: "tarih"
    tip: tarih
    aciklama: "Dosyadaki TEK tarih kaynağı; başka yerde TODAY() kullanılmaz"
    kaynak: "Sistem — dosya açılış tarihi"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: fizikiTolerans
    deger: 50
    birim: "₺"
    tip: para
    aciklama: "Fiziki sayım farkı bu tutarın altındaysa uyarı verilmez"
    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: esikSerbestNakitKritik
    deger: 25000
    birim: "₺"
    tip: para
    aciklama: "Serbest nakit bu eşiğin altındaysa karar DURDUR"
