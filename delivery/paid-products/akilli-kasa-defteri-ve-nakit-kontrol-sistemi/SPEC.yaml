# --- FİYAT ÇAPASI VE SERBEST ALTERNATİF — İŞ KARARI, SAHİBİ DOLDURUR ----------
# Mandata §15/6: "hangi eşiği tutturmak için içeriği zorladın?" sorusunu boş
# bırakmak doğru davranıştır. Bu alanları doldurmak için rakam uydurmak yasaktır.
# D01 ve D02 boş kalınca "UYARI" verir — kapı kandırılmamıştır, ölçüm doğrudur.
deger:
  satis_fiyati_tl: null          # [Varsayım] — Baris dolduracak
  Y1_danisman_ikamesi_tl: null   # [Varsayım] — Baris dolduracak
  Y2_kurulum_ikamesi_tl: null    # [Varsayım] — Baris dolduracak

serbest_alternatif:
  adaylar: []                    # [Varsayım] — Baris dolduracak
  ayrimlar: []                   # [Varsayım] — Baris dolduracak
