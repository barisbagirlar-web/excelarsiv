    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: anomaliSapmaKati
    deger: 3.0
    birim: "kat"
    tip: kat
    aciklama: "Medyan mutlak sapmanın kaç katı anomali sayılır"
