    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: senaryoIyimserKat
    deger: 1.15
    birim: "kat"
    tip: kat
    aciklama: "İyimser senaryo çarpanı"
    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: yuksekTutarEsigi
    deger: 50000
    birim: "₺"
    tip: para
    aciklama: "Bu tutar üstü hareketler yüksek tutar olarak işaretlenir"
    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: makulUstSinir
    deger: 10000000
    birim: "₺"
    tip: para
    aciklama: "Tek hareket için makul üst sınır; üstü veride gerçek dışı giriş ihtimali yüksek"
