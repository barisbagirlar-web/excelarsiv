    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: mesaiBaslangic
    deger: "08:00"
    birim: "saat"
    tip: saat
    aciklama: "Nakit giriş/çıkış pencere başlangıcı"
    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: mesaiBitis
    deger: "19:00"
    birim: "saat"
    tip: saat
    aciklama: "Nakit giriş/çıkış pencere bitişi"
    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: tahminUfkuGun
    deger: 90
    birim: "gün"
    tip: tamsayi
    min: 7
    max: 365
    aciklama: "Nakit tahmin ufku (gün)"
    kaynak: "İşletme kararı"
    yururluk_tarihi: "2026-01-01"
    dogrulama_tarihi: "2026-08-09"
  - anahtar: senaryoKotumserKat
    deger: 0.85
    birim: "kat"
    tip: kat
    aciklama: "Kötümser senaryo çarpanı"
