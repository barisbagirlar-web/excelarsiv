name: Rehber Enterprise One Shot

on:
  push:
    branches:
      - content/rehber-enterprise-2500-release
    paths:
      - scripts/generate-rehber-enterprise.mjs
      - .github/workflows/rehber-enterprise-one-shot.yml

permissions:
  contents: write

concurrency:
  group: rehber-enterprise-one-shot
  cancel-in-progress: false

jobs:
  generate-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: content/rehber-enterprise-2500-release
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate enterprise-depth guides
        run: node scripts/generate-rehber-enterprise.mjs
      - name: Build and repository tests
        run: npm test
      - name: Rehber hard content guard
        run: npx tsx scripts/seo/content-contract.ts --site excelarsiv
      - name: Verify no guide below 2500 visible words
        run: |
          npx tsx scripts/seo/content-contract.ts --site excelarsiv | tee /tmp/rehber-contract.txt
          grep -q "min 2" /tmp/rehber-contract.txt || { cat /tmp/rehber-contract.txt; exit 1; }
      - name: Remove one-shot production artifacts
        run: |
          rm scripts/generate-rehber-enterprise.mjs
          rm .github/workflows/rehber-enterprise-one-shot.yml
      - name: Commit verified output only
        run: |
          git config user.name "excelarsiv-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/guides docs/seo/KARAR_DEFTERI.md scripts/seo/content-contract.ts scripts/generate-rehber-enterprise.mjs .github/workflows/rehber-enterprise-one-shot.yml
          git diff --cached --check
          git status --short
          git commit -m "content: ship enterprise 2500+ word rehber authority layer"
          git push origin HEAD:content/rehber-enterprise-2500-release
