name: Diagnose Cloud Run Startup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-cloudrun.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Inspect Function and Cloud Run configuration
        shell: bash
        run: |
          set -euo pipefail
          for fn in checkoutStatus verifyShopierOrder recoverPurchase createDownloadToken requestProofDemo downloadProofDemo; do
            echo "===== FUNCTION $fn ====="
            gcloud functions describe "$fn" \
              --project="carbon-web-1265b" \
              --gen2 \
              --region="europe-west1" \
              --format='yaml(name,state,buildConfig.entryPoint,buildConfig.runtime,serviceConfig.availableMemory,serviceConfig.environmentVariables,serviceConfig.secretEnvironmentVariables,stateMessages)' || true
          done

          echo "===== CLOUD RUN SERVICE checkoutstatus ====="
          gcloud run services describe checkoutstatus \
            --project="carbon-web-1265b" \
            --region="europe-west1" \
            --format='yaml(metadata.name,status.conditions,status.latestCreatedRevisionName,spec.template.spec.containers)' || true

          echo "===== RECENT REVISIONS checkoutstatus ====="
          gcloud run revisions list \
            --project="carbon-web-1265b" \
            --region="europe-west1" \
            --service="checkoutstatus" \
            --limit=5 \
            --format='table(metadata.name,status.conditions[0].type,status.conditions[0].status,status.conditions[0].message)' || true

      - name: Read failed Function revision logs when permitted
        shell: bash
        run: |
          set -euo pipefail
          for service in checkoutstatus verifyshopierorder recoverpurchase createdownloadtoken requestproofdemo downloadproofdemo; do
            echo "===== LOGS $service ====="
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$service\"" \
              --project="carbon-web-1265b" \
              --freshness=45m \
              --limit=20 \
              --order=desc \
              --format='table(timestamp,severity,textPayload,jsonPayload.message)' || true
          done
