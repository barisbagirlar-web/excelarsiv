name: Diagnose Cloud Run Startup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-cloudrun.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy isolated minimal HTTP function
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/minimal-function
          cat >/tmp/minimal-function/package.json <<'JSON'
          {
            "name": "excelarsiv-minimal-probe",
            "version": "1.0.0",
            "main": "index.js",
            "engines": {"node": "22"},
            "dependencies": {"@google-cloud/functions-framework": "^5.0.5"}
          }
          JSON
          cat >/tmp/minimal-function/index.js <<'JS'
          const functions = require('@google-cloud/functions-framework');
          functions.http('healthProbe', (req, res) => res.status(200).send('OK'));
          JS

          gcloud functions deploy excelarsivHealthProbe \
            --project="carbon-web-1265b" \
            --gen2 \
            --region="europe-west1" \
            --runtime=nodejs22 \
            --source=/tmp/minimal-function \
            --entry-point=healthProbe \
            --trigger-http \
            --allow-unauthenticated \
            --memory=256Mi \
            --max-instances=1 \
            --quiet

          uri="$(gcloud functions describe excelarsivHealthProbe --project=carbon-web-1265b --gen2 --region=europe-west1 --format='value(serviceConfig.uri)')"
          echo "Probe URI: $uri"
          curl --fail --silent --show-error "$uri" | grep -Fx 'OK'

      - name: Inspect production checkout Function
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions describe checkoutStatus \
            --project="carbon-web-1265b" \
            --gen2 \
            --region="europe-west1" \
            --format='yaml(name,state,buildConfig.entryPoint,buildConfig.runtime,serviceConfig.environmentVariables,serviceConfig.secretEnvironmentVariables,stateMessages)'
          gcloud run services describe checkoutstatus \
            --project="carbon-web-1265b" \
            --region="europe-west1" \
            --format='yaml(metadata.name,status.conditions,status.latestCreatedRevisionName,spec.template.spec.containers)'

      - name: Delete isolated probe
        if: always()
        shell: bash
        run: |
          gcloud functions delete excelarsivHealthProbe \
            --project="carbon-web-1265b" \
            --gen2 \
            --region="europe-west1" \
            --quiet || true
