name: Deploy Firebase Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_backend:
        description: 'Backend Functions deployunu açıkça zorla'
        required: false
        type: boolean
        default: false
      force_hosting:
        description: 'Firebase Hosting deployunu açıkça zorla'
        required: false
        type: boolean
        default: false
      force_delivery:
        description: 'Private ücretli ürün Storage senkronizasyonunu açıkça zorla'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: carbon-web-1265b
  FIREBASE_HOSTING_SITE: excelarsiv
  FUNCTIONS_REGION: europe-west1

jobs:
  deploy:
    name: Test and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify merged PR provenance and required green CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PROVENANCE_RETRIES: '8'
          RELEASE_PROVENANCE_RETRY_DELAY_MS: '1500'
        run: node --experimental-strip-types scripts/ci/release-provenance.ts

      - name: Detect runtime changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          backend_changed=false
          hosting_changed=false
          delivery_changed=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            backend_changed='${{ inputs.force_backend }}'
            hosting_changed='${{ inputs.force_hosting }}'
            delivery_changed='${{ inputs.force_delivery }}'
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo 'KALDI: parent commit bulunamadı; otomatik production deploy kararı verilmiyor.'
            exit 1
          else
            if ! git diff --quiet HEAD^ HEAD -- functions/; then
              backend_changed=true
            fi

            if ! git diff --quiet HEAD^ HEAD -- \
              src/ \
              public/ \
              commerce/ \
              firebase.json \
              .firebaserc \
              astro.config.mjs \
              tsconfig.json \
              package.json \
              package-lock.json \
              scripts/seo/generate-artifacts.mjs \
              scripts/seo/finalize-sitemap-index.mjs \
              scripts/seo/validate-gates.mjs \
              scripts/seo/live-contract.mjs \
              scripts/seo/lib.mjs; then
              hosting_changed=true
            fi

            if ! git diff --quiet HEAD^ HEAD -- \
              delivery/paid-products/ \
              commerce/catalog.json \
              scripts/sync-paid-products.mjs \
              scripts/check-paid-products.mjs \
              scripts/package.json \
              scripts/package-lock.json; then
              delivery_changed=true
            fi
          fi

          runtime_changed=false
          if [[ "$backend_changed" == "true" || "$hosting_changed" == "true" || "$delivery_changed" == "true" ]]; then
            runtime_changed=true
          fi

          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "hosting_changed=$hosting_changed" >> "$GITHUB_OUTPUT"
          echo "delivery_changed=$delivery_changed" >> "$GITHUB_OUTPUT"
          echo "runtime_changed=$runtime_changed" >> "$GITHUB_OUTPUT"
          echo "Runtime decision: backend=$backend_changed hosting=$hosting_changed delivery=$delivery_changed runtime=$runtime_changed"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Install production scripts dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Test Functions and Proof Demo
        run: npm --prefix functions test

      - name: Validate commerce, build and smoke test
        run: npm test

      - name: Smoke test Functions HTTP runtime
        shell: bash
        run: |
          set -euo pipefail
          export PORT=8080
          export FUNCTION_TARGET=checkoutStatus
          export GCLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GOOGLE_CLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export FIREBASE_CONFIG="{\"projectId\":\"$FIREBASE_PROJECT_ID\"}"

          npm --prefix functions start >/tmp/functions-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 20); do
            if curl --silent --output /tmp/functions-runtime-response.txt --write-out '%{http_code}' http://127.0.0.1:8080/ | grep -Eq '^(405|400)$'; then
              ready=true
              break
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat /tmp/functions-runtime.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/functions-runtime.log
            exit 1
          fi
          echo "Functions runtime listens on PORT=8080 even when Firebase config omits storageBucket."

      - name: Runtime unchanged — deployment skipped
        if: steps.changes.outputs.runtime_changed != 'true'
        run: echo "Runtime output unchanged; production deployment intentionally skipped."

      - name: Authenticate to Google Cloud
        if: steps.changes.outputs.runtime_changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.changes.outputs.runtime_changed == 'true'
        run: npm install --global firebase-tools@latest

      - name: Firebase deployment identity
        if: steps.changes.outputs.runtime_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!file || !fs.existsSync(file)) throw new Error('ADC credentials file missing');
          const credentials = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!credentials.client_email) throw new Error('Service account client_email missing');
          console.log(`Firebase deploy account: ${credentials.client_email}`);
          console.log(`Project: ${process.env.FIREBASE_PROJECT_ID}`);
          NODE

      - name: Sync changed paid product binaries to private Storage
        if: steps.changes.outputs.delivery_changed == 'true'
        env:
          GCLOUD_PROJECT: ${{ env.FIREBASE_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: carbon-web-1265b.firebasestorage.app
        run: node scripts/sync-paid-products.mjs --apply

      - name: Verify paid product repo-storage SHA-256 parity
        if: steps.changes.outputs.runtime_changed == 'true'
        env:
          GCLOUD_PROJECT: ${{ env.FIREBASE_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: carbon-web-1265b.firebasestorage.app
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-paid-products.mjs --strict --verify-local-parity
          echo "Paid product parity gate passed (satışa açık set repo ↔ private Storage byte-identical)."

      - name: Decide backend deployment
        if: steps.changes.outputs.runtime_changed == 'true'
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          required_functions=(
            checkoutStatus
            verifyShopierOrder
            recoverPurchase
            createDownloadToken
            downloadFile
            requestProofDemo
            downloadProofDemo
            createCheckout
          )

          functions_missing=false
          for name in "${required_functions[@]}"; do
            if ! gcloud functions describe "$name" \
              --project="$FIREBASE_PROJECT_ID" \
              --gen2 \
              --region="$FUNCTIONS_REGION" \
              --format='value(name)' >/dev/null 2>&1; then
              echo "Required function missing or not readable: $name"
              functions_missing=true
            fi
          done

          if [[ "${{ steps.changes.outputs.backend_changed }}" == "true" || "$functions_missing" == "true" ]]; then
            echo "deploy_functions=true" >> "$GITHUB_OUTPUT"
            echo "Backend deployment required."
          else
            echo "deploy_functions=false" >> "$GITHUB_OUTPUT"
            echo "All required functions exist and backend source is unchanged."
          fi

      - name: Deploy verification and delivery Functions with Firebase
        if: steps.changes.outputs.runtime_changed == 'true' && steps.backend.outputs.deploy_functions == 'true'
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only "functions:checkoutStatus,functions:verifyShopierOrder,functions:recoverPurchase,functions:createDownloadToken,functions:downloadFile,functions:requestProofDemo,functions:downloadProofDemo" \
            --non-interactive

      - name: Deploy checkout Function last
        if: steps.changes.outputs.runtime_changed == 'true' && steps.backend.outputs.deploy_functions == 'true'
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only "functions:createCheckout" \
            --non-interactive

      - name: Verify required Functions exist before production release
        if: steps.changes.outputs.runtime_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in checkoutStatus verifyShopierOrder recoverPurchase createDownloadToken downloadFile requestProofDemo downloadProofDemo createCheckout; do
            gcloud functions describe "$name" \
              --project="$FIREBASE_PROJECT_ID" \
              --gen2 \
              --region="$FUNCTIONS_REGION" \
              --format='value(name)' >/dev/null
          done
          echo "All required production Functions are present."

      - name: Finalize sitemap index (canlı baseline ile)
        if: steps.changes.outputs.hosting_changed == 'true'
        env:
          SEO_SITEMAP_INDEX_MIGRATION: ${{ secrets.SEO_SITEMAP_INDEX_MIGRATION }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'SEO_SITEMAP_INDEX_MIGRATION[^#]*1' .github/workflows/deploy-firebase.yml; then
            echo "KALDI: migration flag workflow'a kalıcı yazılmış — ayrı tetikleme gerekir."
            exit 1
          fi
          node scripts/seo/finalize-sitemap-index.mjs
          node scripts/seo/validate-artifacts.mjs

      - name: Deploy Firebase Hosting
        id: hosting
        if: steps.changes.outputs.hosting_changed == 'true'
        env:
          CI: "true"
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only "hosting:$FIREBASE_HOSTING_SITE" --non-interactive

      - name: Verify checkout API is live
        if: steps.changes.outputs.runtime_changed == 'true'
        env:
          BASE_URL: https://excelarsiv.web.app
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/checkout-probe.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/checkout" \
            -H 'Content-Type: application/json' \
            --data '{"productSlug":"__deployment_probe__","email":"probe@example.com"}')"
          cat /tmp/checkout-probe.json
          test "$code" = '400'
          grep -Fq 'UNKNOWN_PRODUCT' /tmp/checkout-probe.json
          rm -f /tmp/checkout-probe.json

      - name: Verify real paid product returns HTTP 201
        if: steps.changes.outputs.runtime_changed == 'true'
        env:
          BASE_URL: https://excelarsiv.web.app
        shell: bash
        run: |
          set -euo pipefail
          checkout_email="deploy-checkout+${GITHUB_RUN_ID}@excelarsiv.com"
          response_file="/tmp/checkout-real.json"
          code="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
            -X POST "$BASE_URL/api/checkout" \
            -H 'Content-Type: application/json' \
            --data "{\"productSlug\":\"13-haftalik-nakit-akisi-ve-odeme-planlama-sistemi\",\"email\":\"$checkout_email\"}")"
          cat "$response_file"
          test "$code" = '201'
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/checkout-real.json', 'utf8'));
          const required = ['checkoutId', 'checkoutSecret', 'productSlug', 'tier', 'amountTL', 'shopierUrl'];
          for (const key of required) if (!x[key]) throw new Error(`checkout response missing ${key}`);
          if (!/^https:\/\/www\.shopier\.com\/\d+$/.test(x.shopierUrl)) throw new Error('shopierUrl invalid');
          if (x.amountTL !== 2490) throw new Error('ENTERPRISE amount mismatch');
          console.log(`REAL CHECKOUT 201 OK: ${x.productSlug} tier=${x.tier} amount=${x.amountTL} shopier=${x.shopierUrl}`);
          NODE
          rm -f "$response_file"

      - name: Verify no catalog product is in sale-disabled state
        if: steps.changes.outputs.runtime_changed == 'true'
        env:
          BASE_URL: https://excelarsiv.web.app
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('commerce/catalog.json', 'utf8'));
          const kapali = Object.entries(catalog.products).filter(([, p]) => p.satista === false);
          if (kapali.length) {
            console.error('Satışa kapalı ürün bulundu:', kapali.map(([s]) => s).join(', '));
            process.exit(1);
          }
          console.log(`KATALOG TAMAM: ${Object.keys(catalog.products).length}/${Object.keys(catalog.products).length} ürün satışa açık.`);
          NODE

      - name: Verify production Proof Demo flow
        if: steps.changes.outputs.runtime_changed == 'true'
        env:
          BASE_URL: https://excelarsiv.web.app
        shell: bash
        run: |
          set -euo pipefail

          smoke_email="deploy-smoke+${GITHUB_RUN_ID}@excelarsiv.com"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST "$BASE_URL/api/demo-request" \
            -H 'Content-Type: application/json' \
            --data "{\"productSlug\":\"akilli-kasa-defteri-ve-nakit-kontrol-sistemi\",\"email\":\"$smoke_email\",\"acceptedTerms\":true}" \
            -o /tmp/demo-response.json

          download_url="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/demo-response.json','utf8'));if(!x.downloadUrl||!x.demoId)process.exit(2);process.stdout.write(x.downloadUrl)")"
          demo_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/demo-response.json','utf8'));process.stdout.write(x.demoId)")"

          case "$download_url" in
            /api/demo-download?token=*) ;;
            *) echo 'Invalid Proof Demo download path'; exit 3 ;;
          esac

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -D /tmp/demo-headers.txt \
            -o /tmp/proof-demo.xlsx \
            "$BASE_URL$download_url"

          unzip -t /tmp/proof-demo.xlsx >/dev/null
          grep -Fqi 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' /tmp/demo-headers.txt
          grep -Fqi "X-ExcelArsiv-Demo-Id: $demo_id" /tmp/demo-headers.txt

          second_code="$(curl --silent --show-error -o /tmp/demo-second.json -w '%{http_code}' "$BASE_URL$download_url")"
          test "$second_code" = '410'
          grep -Fq 'TOKEN_EXPIRED' /tmp/demo-second.json

          rm -f /tmp/demo-response.json /tmp/demo-headers.txt /tmp/proof-demo.xlsx /tmp/demo-second.json

      - name: Verify custom domain
        if: steps.changes.outputs.runtime_changed == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://excelarsiv.com/ >/dev/null

      - name: SEO live contract
        if: steps.changes.outputs.hosting_changed == 'true'
        env:
          SEO_BASE_URL: https://excelarsiv.com
        run: node scripts/seo/live-contract.mjs

      - name: Verify live IndexNow ownership key
        if: always() && steps.changes.outputs.hosting_changed == 'true' && steps.hosting.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n[:space:]' < public/indexnow-key.txt)"
          actual="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors https://excelarsiv.com/indexnow-key.txt | tr -d '\r\n[:space:]')"
          [[ "$actual" == "$expected" ]] || { echo 'IndexNow ownership key mismatch'; exit 1; }
          echo 'INDEXNOW KEY LIVE PASS'

      - name: Submit changed and new URLs to IndexNow
        if: always() && steps.changes.outputs.hosting_changed == 'true' && steps.hosting.conclusion == 'success'
        run: node scripts/seo/indexnow.mjs

      - name: Upload production SEO proof bundle
        if: steps.changes.outputs.hosting_changed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-production-proof-${{ github.run_id }}
          path: |
            dist/seo-finalize-report.json
            dist/indexnow-submission.json
            dist/INDEXNOW_SUBMISSION.md
          if-no-files-found: error
          retention-days: 30
