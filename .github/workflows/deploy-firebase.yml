name: Deploy Firebase Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: carbon-web-1265b
  FIREBASE_HOSTING_SITE: excelarsiv
  FUNCTIONS_REGION: europe-west1

jobs:
  deploy:
    name: Test and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Test Functions and Proof Demo
        run: npm --prefix functions test

      - name: Validate commerce, build and smoke test
        run: npm test

      - name: Smoke test Functions HTTP runtime
        shell: bash
        run: |
          set -euo pipefail
          export PORT=8080
          export FUNCTION_TARGET=checkoutStatus
          export GCLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export GOOGLE_CLOUD_PROJECT="$FIREBASE_PROJECT_ID"
          export FIREBASE_CONFIG="{\"projectId\":\"$FIREBASE_PROJECT_ID\"}"

          npm --prefix functions start >/tmp/functions-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 20); do
            if curl --silent --output /tmp/functions-runtime-response.txt --write-out '%{http_code}' http://127.0.0.1:8080/ | grep -Eq '^(405|400)$'; then
              ready=true
              break
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat /tmp/functions-runtime.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/functions-runtime.log
            exit 1
          fi
          echo "Functions runtime listens on PORT=8080 even when Firebase config omits storageBucket."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Firebase deployment identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          if (!file || !fs.existsSync(file)) throw new Error('ADC credentials file missing');
          const credentials = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!credentials.client_email) throw new Error('Service account client_email missing');
          console.log(`Firebase deploy account: ${credentials.client_email}`);
          console.log(`Project: ${process.env.FIREBASE_PROJECT_ID}`);
          NODE

      - name: Decide backend deployment
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          required_functions=(
            checkoutStatus
            verifyShopierOrder
            recoverPurchase
            createDownloadToken
            downloadFile
            requestProofDemo
            downloadProofDemo
            createCheckout
          )

          functions_changed=true
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- functions/; then
            functions_changed=false
          fi

          functions_missing=false
          for name in "${required_functions[@]}"; do
            if ! gcloud functions describe "$name" \
              --project="$FIREBASE_PROJECT_ID" \
              --gen2 \
              --region="$FUNCTIONS_REGION" \
              --format='value(name)' >/dev/null 2>&1; then
              echo "Required function missing or not readable: $name"
              functions_missing=true
            fi
          done

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$functions_changed" == "true" || "$functions_missing" == "true" ]]; then
            echo "deploy_functions=true" >> "$GITHUB_OUTPUT"
            echo "Backend deployment required."
          else
            echo "deploy_functions=false" >> "$GITHUB_OUTPUT"
            echo "All required functions exist and backend source is unchanged."
          fi

      - name: Deploy verification and delivery Functions with Firebase
        if: steps.backend.outputs.deploy_functions == 'true'
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only "functions:checkoutStatus,functions:verifyShopierOrder,functions:recoverPurchase,functions:createDownloadToken,functions:requestProofDemo,functions:downloadProofDemo" \
            --non-interactive

      - name: Deploy paid-file download Function within CPU quota
        if: steps.backend.outputs.deploy_functions == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions deploy downloadFile \
            --project="$FIREBASE_PROJECT_ID" \
            --gen2 \
            --region="$FUNCTIONS_REGION" \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=downloadFile \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512Mi \
            --timeout=60s \
            --max-instances=20 \
            --quiet

      - name: Deploy checkout Function last
        if: steps.backend.outputs.deploy_functions == 'true'
        env:
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only "functions:createCheckout" \
            --non-interactive

      - name: Print Cloud Run startup logs on deployment failure
        if: failure()
        shell: bash
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND timestamp>="'"$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)'"'"' \
            --project="$FIREBASE_PROJECT_ID" \
            --limit=120 \
            --order=desc \
            --format='table(timestamp,resource.labels.service_name,severity,textPayload,jsonPayload.message)' || true

      - name: Verify required Functions exist before Hosting release
        shell: bash
        run: |
          set -euo pipefail
          for name in checkoutStatus verifyShopierOrder recoverPurchase createDownloadToken downloadFile requestProofDemo downloadProofDemo createCheckout; do
            gcloud functions describe "$name" \
              --project="$FIREBASE_PROJECT_ID" \
              --gen2 \
              --region="$FUNCTIONS_REGION" \
              --format='value(name)' >/dev/null
          done
          echo "All required production Functions are present."

      - name: Deploy Firebase Hosting
        env:
          CI: "true"
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only "hosting:$FIREBASE_HOSTING_SITE" --non-interactive

      - name: Verify checkout API is live
        env:
          BASE_URL: https://excelarsiv.web.app
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/checkout-probe.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/checkout" \
            -H 'Content-Type: application/json' \
            --data '{"productSlug":"__deployment_probe__","email":"probe@example.com"}')"
          cat /tmp/checkout-probe.json
          test "$code" = '400'
          grep -Fq 'UNKNOWN_PRODUCT' /tmp/checkout-probe.json
          rm -f /tmp/checkout-probe.json

      - name: Verify production Proof Demo flow
        env:
          BASE_URL: https://excelarsiv.web.app
        shell: bash
        run: |
          set -euo pipefail

          smoke_email="deploy-smoke+${GITHUB_RUN_ID}@excelarsiv.com"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST "$BASE_URL/api/demo-request" \
            -H 'Content-Type: application/json' \
            --data "{\"productSlug\":\"akilli-kasa-defteri-ve-nakit-kontrol-sistemi\",\"email\":\"$smoke_email\",\"acceptedTerms\":true}" \
            -o /tmp/demo-response.json

          download_url="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/demo-response.json','utf8'));if(!x.downloadUrl||!x.demoId)process.exit(2);process.stdout.write(x.downloadUrl)")"
          demo_id="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/demo-response.json','utf8'));process.stdout.write(x.demoId)")"

          case "$download_url" in
            /api/demo-download?token=*) ;;
            *) echo 'Invalid Proof Demo download path'; exit 3 ;;
          esac

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -D /tmp/demo-headers.txt \
            -o /tmp/proof-demo.xlsx \
            "$BASE_URL$download_url"

          unzip -t /tmp/proof-demo.xlsx >/dev/null
          grep -Fqi 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' /tmp/demo-headers.txt
          grep -Fqi "X-ExcelArsiv-Demo-Id: $demo_id" /tmp/demo-headers.txt

          second_code="$(curl --silent --show-error -o /tmp/demo-second.json -w '%{http_code}' "$BASE_URL$download_url")"
          test "$second_code" = '410'
          grep -Fq 'TOKEN_EXPIRED' /tmp/demo-second.json

          rm -f /tmp/demo-response.json /tmp/demo-headers.txt /tmp/proof-demo.xlsx /tmp/demo-second.json

      - name: Verify custom domain
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://excelarsiv.com/ >/dev/null
