name: SEO Live Contract

on:
  workflow_run:
    workflows:
      - Deploy Firebase Production
    types:
      - completed
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-live-contract
  cancel-in-progress: true

jobs:
  verify-live-seo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify canonical SEO discovery artifacts and URLs
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://excelarsiv.com'
          INDEXNOW_KEY='3e30f6551055f0d7c7ac63f2931e6986'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          fetch_exact_with_retry() {
            local url="$1"
            local out="$2"
            local ok='false'
            local code='000'
            for attempt in $(seq 1 8); do
              code="$(curl --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --output "$out" --write-out '%{http_code}' \
                "$url" || true)"
              if [[ "$code" == '200' && -s "$out" ]]; then
                ok='true'
                break
              fi
              echo "Attempt $attempt failed for $url (HTTP $code); retrying..."
              sleep 5
            done
            [[ "$ok" == 'true' ]] || { echo "P0: $url live contract failed (HTTP $code)"; exit 1; }
          }

          fetch_exact_with_retry "$ORIGIN/robots.txt" "$TMP/robots.txt"
          fetch_exact_with_retry "$ORIGIN/sitemap.xml" "$TMP/sitemap.xml"
          fetch_exact_with_retry "$ORIGIN/llms.txt" "$TMP/llms.txt"
          fetch_exact_with_retry "$ORIGIN/llms-full.txt" "$TMP/llms-full.txt"
          fetch_exact_with_retry "$ORIGIN/indexnow-key.txt" "$TMP/indexnow-key.txt"

          grep -Fq 'Sitemap: https://excelarsiv.com/sitemap.xml' "$TMP/robots.txt"
          grep -Fq '<sitemapindex' "$TMP/sitemap.xml"
          grep -Fq 'https://excelarsiv.com/sitemap.xml' "$TMP/llms.txt"
          grep -Fq 'https://excelarsiv.com/sitemap.xml' "$TMP/llms-full.txt"
          [[ "$(tr -d '\r\n[:space:]' < "$TMP/indexnow-key.txt")" == "$INDEXNOW_KEY" ]] || { echo 'P0: IndexNow ownership key mismatch'; exit 1; }

          mapfile -t children < <(grep -oE '<loc>https://excelarsiv\.com/[^<]+\.xml</loc>' "$TMP/sitemap.xml" | sed -E 's#</?loc>##g')
          [[ "${#children[@]}" -gt 0 ]] || { echo 'P0: sitemap index has no child sitemaps'; exit 1; }

          : > "$TMP/urls.txt"
          image_sitemap_seen='false'
          image_sitemap_url_count=0
          for child in "${children[@]}"; do
            name="${child#${ORIGIN}/}"
            fetch_exact_with_retry "$child" "$TMP/$name"
            grep -Fq '<urlset' "$TMP/$name"
            if grep -Eq '<priority>|<changefreq>' "$TMP/$name"; then
              echo "P0: deprecated/noisy sitemap fields in $name"
              exit 1
            fi

            # Google image sitemap protocol intentionally reuses the canonical product <loc>
            # while attaching image:image metadata. Validate that child independently, but do
            # not mix those repeated locs into the canonical page inventory/duplicate gate.
            if [[ "$name" == 'sitemap-images.xml' ]]; then
              image_sitemap_seen='true'
              image_sitemap_url_count="$(grep -oE '<loc>https://excelarsiv\.com/[^<]*</loc>' "$TMP/$name" | wc -l | tr -d ' ')"
              [[ "$image_sitemap_url_count" -gt 0 ]] || { echo 'P0: image sitemap has zero product URLs'; exit 1; }
              grep -Fq '<image:image>' "$TMP/$name" || { echo 'P0: image sitemap has no image:image entries'; exit 1; }
              continue
            fi

            grep -oE '<loc>https://excelarsiv\.com/[^<]*</loc>' "$TMP/$name" | sed -E 's#</?loc>##g' >> "$TMP/urls.txt"
          done

          [[ "$image_sitemap_seen" == 'true' ]] || { echo 'P0: sitemap-images.xml missing from sitemap index'; exit 1; }
          total_urls="$(wc -l < "$TMP/urls.txt" | tr -d ' ')"
          [[ "$total_urls" -gt 0 ]] || { echo 'P0: sitemap has zero canonical URLs'; exit 1; }
          grep -Fxq "$ORIGIN/" "$TMP/urls.txt" || { echo 'P0: homepage missing from sitemap contract'; exit 1; }

          duplicates="$(sort "$TMP/urls.txt" | uniq -d)"
          [[ -z "$duplicates" ]] || { echo "P0: duplicate canonical sitemap URLs"; echo "$duplicates"; exit 1; }

          index=0
          while IFS= read -r url; do
            index=$((index + 1))
            page="$TMP/page-$index.html"
            fetch_exact_with_retry "$url" "$page"

            node - "$page" "$url" <<'NODE'
          const fs = require('fs');
          const [file, expected] = process.argv.slice(2);
          const html = fs.readFileSync(file, 'utf8');

          function attr(tag, name) {
            const re = new RegExp(`\\b${name}\\s*=\\s*(?:"([^"]*)"|'([^']*)'|([^\\s>]+))`, 'i');
            const match = tag.match(re);
            return match ? (match[1] || match[2] || match[3] || '') : '';
          }

          let canonical = '';
          for (const tag of html.match(/<link\b[^>]*>/gi) || []) {
            const rel = attr(tag, 'rel').toLowerCase().split(/\s+/);
            if (rel.includes('canonical')) {
              canonical = attr(tag, 'href');
              break;
            }
          }

          let robots = '';
          for (const tag of html.match(/<meta\b[^>]*>/gi) || []) {
            if (attr(tag, 'name').toLowerCase() === 'robots') {
              robots = attr(tag, 'content');
              break;
            }
          }

          if (canonical !== expected) throw new Error(`CANONICAL_DRIFT: ${expected} -> ${canonical || 'MISSING'}`);
          if (/(^|[\s,])noindex([\s,]|$)/i.test(robots)) throw new Error(`NOINDEX_IN_SITEMAP: ${expected}`);
          if (!/<h1(?:\s|>)/i.test(html)) throw new Error(`H1_MISSING: ${expected}`);
          if (!/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>/i.test(html)) throw new Error(`JSON_LD_MISSING: ${expected}`);
          NODE
          done < "$TMP/urls.txt"

          echo "SEO LIVE CONTRACT PASS — $total_urls canonical 200/indexable URL across ${#children[@]} child sitemap(s), image URLs=$image_sitemap_url_count, AI discovery files + IndexNow key live."
