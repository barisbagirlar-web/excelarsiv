name: Repair dependency lock

on:
  push:
    branches:
      - fix/ooxml-download-integrity

permissions:
  contents: write

concurrency:
  group: repair-dependency-lock
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/ooxml-download-integrity
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lock with npm security fixes
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify high/critical production audit is clean
        run: npm audit --omit=dev --audit-level=high
      - name: Commit repaired lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh transitive dependency lock"
          git push origin HEAD:fix/ooxml-download-integrity
