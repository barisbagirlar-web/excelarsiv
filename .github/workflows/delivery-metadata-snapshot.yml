name: Delivery Metadata Snapshot

on:
  push:
    branches: [security/public-paid-workbooks-hotfix]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print deterministic delivery metadata
        run: node scripts/read-delivery-metadata.mjs --json
      - name: Print paid product SHA256
        run: find delivery/paid-products -type f \( -name 'current.xlsx' -o -name 'current.xlsm' \) -print0 | sort -z | xargs -0 sha256sum
# temporary extraction workflow; removed by the hotfix
