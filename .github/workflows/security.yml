name: Security Gates

on:
  pull_request:
  push:
    branches: [main, content/rehber-enterprise-2500-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rehber-enterprise-generation:
    if: github.ref == 'refs/heads/content/rehber-enterprise-2500-release'
    name: Rehber enterprise generate + build + guard + clean commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate 2.800+ enterprise guides
        run: node scripts/generate-rehber-enterprise.mjs
      - name: Build and repository tests before output commit
        run: npm test
      - name: Rehber 2.500+ hard guard before output commit
        run: npx tsx scripts/seo/content-contract.ts --site excelarsiv
      - name: Remove temporary generation artifacts and restore canonical workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/security.yml
          rm -f .github/workflows/rehber-enterprise-one-shot.yml
          rm -f scripts/generate-rehber-enterprise.mjs
      - name: Verify clean patch and commit only verified deliverables
        run: |
          git config user.name "excelarsiv-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/guides docs/seo/KARAR_DEFTERI.md scripts/seo/content-contract.ts .github/workflows/security.yml .github/workflows/rehber-enterprise-one-shot.yml scripts/generate-rehber-enterprise.mjs
          git diff --cached --check
          git status --short
          git commit -m "content: ship enterprise 2500+ word rehber authority layer"
          git push origin HEAD:content/rehber-enterprise-2500-release

  production-dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit site production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit Functions production dependencies
        run: npm audit --prefix functions --omit=dev --audit-level=high

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, patched after 2026 Trivy supply-chain incident
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,dist,.git
