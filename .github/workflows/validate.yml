name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/proof-demo-v2

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Install workbook validation engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Test commerce and Proof Demo functions
        run: npm --prefix functions test

      - name: Build and smoke test
        run: npm test

      - name: Generate all 12 Proof Demo workbooks
        run: node functions/test/export-proof-demos.js /tmp/proof-demos

      - name: Validate Proof Demo workbook integrity with LibreOffice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof-demos-recalc
          count=0
          for file in /tmp/proof-demos/*.xlsx; do
            count=$((count+1))
            libreoffice --headless --convert-to xlsx --outdir /tmp/proof-demos-recalc "$file" >/tmp/lo.log 2>&1 || {
              cat /tmp/lo.log
              exit 1
            }
            out="/tmp/proof-demos-recalc/$(basename "$file")"
            test -s "$out" || { echo "HATA: LibreOffice çıktı üretmedi: $file"; cat /tmp/lo.log; exit 1; }
          done
          test "$count" -eq 12 || { echo "HATA: 12 Proof Demo bekleniyor, bulunan $count"; exit 1; }
          echo "12/12 Proof Demo LibreOffice tarafından açıldı ve yeniden kaydedildi."
