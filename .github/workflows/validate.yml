name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/proof-demo-v2

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Install workbook validation engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Test commerce and Proof Demo functions
        run: npm --prefix functions test

      - name: Build and smoke test
        run: npm test

      - name: Generate catalog Proof Demo workbooks
        run: node functions/test/export-proof-demos.js /tmp/proof-demos

      - name: Validate Proof Demo workbook integrity with LibreOffice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof-demos-recalc
          expected="$(node -e "console.log(Object.keys(require('./functions/catalog').PRODUCTS).length)")"
          count=0
          for file in /tmp/proof-demos/*.xlsx; do
            count=$((count+1))
            libreoffice --headless --convert-to xlsx --outdir /tmp/proof-demos-recalc "$file" >/tmp/lo.log 2>&1 || {
              cat /tmp/lo.log
              exit 1
            }
            out="/tmp/proof-demos-recalc/$(basename "$file")"
            test -s "$out" || { echo "HATA: LibreOffice çıktı üretmedi: $file"; cat /tmp/lo.log; exit 1; }
          done
          test "$count" -eq "$expected" || { echo "HATA: $expected Proof Demo bekleniyor, bulunan $count"; exit 1; }
          echo "$count/$expected Proof Demo LibreOffice tarafından açıldı ve yeniden kaydedildi."

      - name: Validate paid product workbook integrity with LibreOffice
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find delivery/paid-products -type f \( -name 'current.xlsx' -o -name 'current.xlsm' \) -print | sort)
          test "${#files[@]}" -gt 0 || { echo 'HATA: ücretli ürün kaynağı bulunamadı'; exit 1; }
          count=0
          for file in "${files[@]}"; do
            count=$((count+1))
            outdir="/tmp/paid-product-recalc/$count"
            mkdir -p "$outdir"
            libreoffice --headless --convert-to xlsx --outdir "$outdir" "$file" >/tmp/lo-paid.log 2>&1 || {
              echo "HATA: ücretli workbook açılamadı: $file"
              cat /tmp/lo-paid.log
              exit 1
            }
            generated="$(find "$outdir" -maxdepth 1 -type f -name '*.xlsx' -print -quit)"
            test -n "$generated" && test -s "$generated" || {
              echo "HATA: ücretli workbook yeniden kaydedilemedi: $file"
              cat /tmp/lo-paid.log
              exit 1
            }
          done
          echo "$count ücretli ürün workbook'u LibreOffice tarafından açıldı ve yeniden kaydedildi."
